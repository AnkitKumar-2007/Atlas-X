services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: atlas-x-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas_x
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - atlas_x_pgdata:/var/lib/postgresql/data

volumes:
  atlas_x_pgdata:
